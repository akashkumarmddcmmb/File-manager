name: build-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Java and Gradle
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      - name: Clean Gradle
        working-directory: android
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Find APK
        if: success()
        run: |
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Rename APK
        if: success()
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/Files-Google-File-Manager-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Files-Google-File-Manager-debug
          path: release/Files-Google-File-Manager-debug.apk
          if-no-files-found: error
          retention-days: 30
