name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Setup Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # 3. Setup Bun
      # Project contains bun.lock
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"


      # 4. Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # 5. Show versions
      - name: Check versions
        run: |
          node --version
          bun --version
          java -version


      # 6. Install exact locked dependencies
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile


      # 7. Build web application
      - name: Build web
        run: |
          bun run build


      # 8. Sync Capacitor
      # This regenerates Capacitor Android Gradle files if required.
      - name: Capacitor Sync
        run: |
          bunx cap sync android


      # 9. Verify Android project
      - name: Verify Android project
        working-directory: android
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Checking Capacitor Gradle files..."

          test -f capacitor.settings.gradle
          test -f capacitor.build.gradle

          chmod +x gradlew

          echo "Android project verification successful."


      # 10. Check Gradle
      - name: Check Gradle
        working-directory: android
        run: |
          ./gradlew --version


      # 11. Check Gradle modules
      - name: Check Gradle modules
        working-directory: android
        run: |
          ./gradlew projects \
            --no-daemon \
            --stacktrace


      # 12. Clean
      - name: Clean
        working-directory: android
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # 13. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # 14. Verify APK
      - name: Verify APK
        run: |
          set -e

          echo "Generated APK files:"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."


      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
