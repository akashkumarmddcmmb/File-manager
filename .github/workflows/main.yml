package com.akash.filemanager;

import android.content.ContentResolver;
import android.content.Context;
import android.net.Uri;
import android.os.Handler;
import android.os.Looper;
import android.provider.DocumentsContract;

import java.io.InputStream;
import java.io.OutputStream;
import java.util.ArrayList;
import java.util.List;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class FileOperationManager {

    public interface Callback {

        void success(String message);

        void error(String message);
    }

    private final Context context;

    private final ContentResolver resolver;

    private final ExecutorService executor =
            Executors.newSingleThreadExecutor();

    private final Handler main =
            new Handler(Looper.getMainLooper());

    public FileOperationManager(Context context) {

        this.context =
                context.getApplicationContext();

        this.resolver =
                context.getContentResolver();
    }

    public void createFolder(
            Uri parent,
            String name,
            Callback callback) {

        executor.execute(() -> {

            try {

                Uri result =
                        DocumentsContract.createDocument(
                                resolver,
                                parent,
                                DocumentsContract.Document
                                        .MIME_TYPE_DIR,
                                name
                        );

                finish(
                        callback,
                        result != null,
                        result != null
                                ? "Folder created"
                                : "Could not create folder"
                );

            } catch (Exception e) {

                finish(
                        callback,
                        false,
                        getError(e)
                );
            }
        });
    }

    public void rename(
            Uri source,
            String name,
            Callback callback) {

        executor.execute(() -> {

            try {

                Uri result =
                        DocumentsContract.renameDocument(
                                resolver,
                                source,
                                name
                        );

                finish(
                        callback,
                        result != null,
                        result != null
                                ? "Renamed successfully"
                                : "Could not rename"
                );

            } catch (Exception e) {

                finish(
                        callback,
                        false,
                        getError(e)
                );
            }
        });
    }

    public void delete(
            Uri source,
            Callback callback) {

        executor.execute(() -> {

            try {

                boolean result =
                        DocumentsContract.deleteDocument(
                                resolver,
                                source
                        );

                finish(
                        callback,
                        result,
                        result
                                ? "Deleted"
                                : "Could not delete"
                );

            } catch (Exception e) {

                finish(
                        callback,
                        false,
                        getError(e)
                );
            }
        });
    }

    public void copy(
            Uri source,
            Uri destination,
            Callback callback) {

        executor.execute(() -> {

            try {

                Uri result =
                        copyRecursively(
                                source,
                                destination
                        );

                finish(
                        callback,
                        result != null,
                        result != null
                                ? "Copied successfully"
                                : "Copy failed"
                );

            } catch (Exception e) {

                finish(
                        callback,
                        false,
                        getError(e)
                );
            }
        });
    }

    public void move(
            Uri source,
            Uri destination,
            Callback callback) {

        executor.execute(() -> {

            try {

                Uri copied =
                        copyRecursively(
                                source,
                                destination
                        );

                if (copied == null) {

                    finish(
                            callback,
                            false,
                            "Move failed"
                    );

                    return;
                }

                boolean deleted =
                        DocumentsContract.deleteDocument(
                                resolver,
                                source
                        );

                if (!deleted) {

                    finish(
                            callback,
                            false,
                            "Copied but original could not be removed"
                    );

                    return;
                }

                finish(
                        callback,
                        true,
                        "Moved successfully"
                );

            } catch (Exception e) {

                finish(
                        callback,
                        false,
                        getError(e)
                );
            }
        });
    }

    private Uri copyRecursively(
            Uri source,
            Uri destination)
            throws Exception {

        String name =
                FileUtils.queryDisplayName(
                        context,
                        source
                );

        String mime =
                queryMime(source);

        if (DocumentsContract.Document
                .MIME_TYPE_DIR
                .equals(mime)) {

            Uri target =
                    DocumentsContract.createDocument(
                            resolver,
                            destination,
                            DocumentsContract.Document
                                    .MIME_TYPE_DIR,
                            name
                    );

            if (target == null) {
                return null;
            }

            List<Uri> children =
                    listChildren(source);

            for (Uri child : children) {

                Uri result =
                        copyRecursively(
                                child,
                                target
                        );

                if (result == null) {
                    return null;
                }
            }

            return target;
        }

        Uri target =
                DocumentsContract.createDocument(
                        resolver,
                        destination,
                        mime,
                        name
                );

        if (target == null) {
            return null;
        }

        try (
                InputStream input =
                        resolver.openInputStream(
                                source
                        );

                OutputStream output =
                        resolver.openOutputStream(
                                target,
                                "w"
                        )
        ) {

            if (input == null ||
                    output == null) {

                return null;
            }

            byte[] buffer =
                    new byte[64 * 1024];

            int count;

            while (
                    (count =
                            input.read(buffer))
                            != -1
            ) {

                output.write(
                        buffer,
                        0,
                        count
                );
            }

            output.flush();
        }

        return target;
    }

    private String queryMime(Uri uri) {

        try (
                android.database.Cursor cursor =
                        resolver.query(
                                uri,
                                new String[]{
                                        DocumentsContract.Document
                                                .COLUMN_MIME_TYPE
                                },
                                null,
                                null,
                                null
                        )
        ) {

            if (cursor != null &&
                    cursor.moveToFirst()) {

                return cursor.getString(0);
            }

        } catch (Exception ignored) {
        }

        return "application/octet-stream";
    }

    private List<Uri> listChildren(
            Uri parent) {

        List<Uri> result =
                new ArrayList<>();

        Uri childrenUri =
                DocumentsContract
                        .buildChildDocumentsUriUsingTree(
                                parent,
                                DocumentsContract
                                        .getDocumentId(parent)
                        );

        try (
                android.database.Cursor cursor =
                        resolver.query(
                                childrenUri,
                                new String[]{
                                        DocumentsContract.Document
                                                .COLUMN_DOCUMENT_ID
                                },
                                null,
                                null,
                                null
                        )
        ) {

            if (cursor != null) {

                while (cursor.moveToNext()) {

                    String id =
                            cursor.getString(0);

                    result.add(
                            DocumentsContract
                                    .buildDocumentUriUsingTree(
                                            parent,
                                            id
                                    )
                    );
                }
            }

        } catch (Exception ignored) {
        }

        return result;
    }

    private void finish(
            Callback callback,
            boolean success,
            String message) {

        main.post(() -> {

            if (success) {

                callback.success(message);

            } else {

                callback.error(message);
            }
        });
    }

    private String getError(
            Exception exception) {

        if (exception.getMessage() == null) {

            return "File operation failed";
        }

        return exception.getMessage();
    }

    public void shutdown() {

        executor.shutdownNow();
    }
}


