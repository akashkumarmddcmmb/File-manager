name: build-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      # 4. Show environment
      - name: Check Environment
        run: |
          echo "Java:"
          java -version

          echo "Bun:"
          bun --version

          echo "Node:"
          node --version

      # 5. Install dependencies
      - name: Install Dependencies
        run: |
          bun install --no-frozen-lockfile

      # 6. Build web application
      - name: Build Web App
        run: |
          bun run build

      # 7. Sync Capacitor Android
      - name: Sync Capacitor Android
        run: |
          bunx cap sync android

      # 8. Make Gradle executable
      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      # 9. Check Gradle
      - name: Check Gradle
        working-directory: android
        run: |
          ./gradlew --version

      # 10. Clean Android build
      - name: Clean Android Build
        working-directory: android
        run: |
          ./gradlew clean --stacktrace

      # 11. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all

      # 12. Find APK
      - name: Find APK
        if: success()
        run: |
          echo "Searching APK..."
          find android/app/build/outputs -type f -name "*.apk" -print

      # 13. Prepare release folder
      - name: Prepare Release
        if: success()
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/Files-Google-File-Manager-debug.apk

      # 14. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Files-Google-File-Manager-debug
          path: release/Files-Google-File-Manager-debug.apk
          if-no-files-found: error
          retention-days: 30
