name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Set up Gradle
      # This also provides the Gradle command even when
      # gradlew is missing from the project.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Check project
      - name: Check project files
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Searching for Gradle files:"
          find . -maxdepth 3 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

      # 5. Create Gradle Wrapper if it is missing
      - name: Create Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew is missing."
            echo "Creating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.9
          else
            echo "gradlew already exists."
          fi

      # 6. Make gradlew executable
      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          chmod +x ./gradlew
          ls -l ./gradlew

      # 7. Clean project
      - name: Clean
        shell: bash
        run: |
          ./gradlew clean --stacktrace

      # 8. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 9. Find generated APK
      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
