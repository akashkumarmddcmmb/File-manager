name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java 21
      # Capacitor 8 Android build
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # --------------------------------------------------
      # 3. Setup Bun
      # --------------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'


      # --------------------------------------------------
      # 4. Check build environment
      # --------------------------------------------------
      - name: Check Environment
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "BUN VERSION"
          echo "========================================"
          bun --version

          echo ""
          echo "========================================"
          echo "NODE VERSION"
          echo "========================================"
          node --version

          echo ""
          echo "========================================"
          echo "JAVA HOME"
          echo "========================================"
          echo "$JAVA_HOME"


      # --------------------------------------------------
      # 5. Install JavaScript dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile


      # --------------------------------------------------
      # 6. TypeScript check
      # --------------------------------------------------
      - name: TypeScript Check
        shell: bash
        run: |
          bun run lint


      # --------------------------------------------------
      # 7. Build React/Vite application
      # --------------------------------------------------
      - name: Build Web Application
        shell: bash
        run: |
          bun run build

          echo ""
          echo "========================================"
          echo "DIST CONTENT"
          echo "========================================"

          if [ -d "dist" ]; then
            find dist -maxdepth 2 -type f | head -100
          else
            echo "ERROR: dist directory was not created."
            exit 1
          fi


      # --------------------------------------------------
      # 8. Check Capacitor
      # --------------------------------------------------
      - name: Check Capacitor
        shell: bash
        run: |
          bunx cap --version

          echo ""
          echo "========================================"
          echo "CAPACITOR CONFIG"
          echo "========================================"

          if [ -f "capacitor.config.ts" ]; then
            cat capacitor.config.ts
          elif [ -f "capacitor.config.json" ]; then
            cat capacitor.config.json
          else
            echo "ERROR: Capacitor configuration file not found."
            exit 1
          fi


      # --------------------------------------------------
      # 9. Create Android project if missing
      # --------------------------------------------------
      - name: Create Android Platform
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform does not exist."
            echo "Creating Android platform..."

            bunx cap add android
          else
            echo "Android platform already exists."
          fi


      # --------------------------------------------------
      # 10. Sync Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor Android
        shell: bash
        run: |
          bunx cap sync android


      # --------------------------------------------------
      # 11. Verify Android project
      # --------------------------------------------------
      - name: Verify Android Project
        shell: bash
        run: |
          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "ERROR: android directory not found."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          echo ""
          echo "Android files:"
          find android -maxdepth 2 -type f | head -100

          echo ""
          echo "Gradle wrapper:"
          ls -la android/gradlew


      # --------------------------------------------------
      # 12. Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle Executable
        shell: bash
        run: |
          chmod +x android/gradlew


      # --------------------------------------------------
      # 13. Check Gradle / Java
      # --------------------------------------------------
      - name: Check Gradle Environment
        working-directory: android
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          ./gradlew --version


      # --------------------------------------------------
      # 14. Clean previous build
      # --------------------------------------------------
      - name: Clean Android Build
        working-directory: android
        shell: bash
        run: |
          ./gradlew clean --stacktrace


      # --------------------------------------------------
      # 15. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "STARTING ANDROID APK BUILD"
          echo "========================================"

          ./gradlew assembleDebug \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee ../gradle-build.log

          GRADLE_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE"
          echo "========================================"

          echo "$GRADLE_EXIT"

          echo ""
          echo "========================================"
          echo "IMPORTANT BUILD ERRORS"
          echo "========================================"

          grep -n -E \
            "error:|ERROR|FAILED|FAILURE|cannot find symbol|does not exist|Compilation failed|Execution failed|Could not resolve|Could not find" \
            ../gradle-build.log || true

          exit "$GRADLE_EXIT"


      # --------------------------------------------------
      # 16. Find generated APK
      # --------------------------------------------------
      - name: Find APK
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------------------------
      # 17. Prepare APK
      # --------------------------------------------------
      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          mkdir -p release

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available APK files:"
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK_PATH" \
            "release/File-Manager-debug.apk"

          echo ""
          echo "APK successfully prepared:"
          ls -lh release/File-Manager-debug.apk


      # --------------------------------------------------
      # 18. Upload APK
      # --------------------------------------------------
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-debug-APK
          path: release/File-Manager-debug.apk
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------
      # 19. Upload full Gradle log
      # --------------------------------------------------
      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7
