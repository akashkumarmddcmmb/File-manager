package com.akash.filemanager;

import android.graphics.Typeface;
import android.view.LayoutInflater;
import android.view.View;
import android.view.ViewGroup;
import android.widget.ImageView;
import android.widget.TextView;

import androidx.annotation.NonNull;
import androidx.recyclerview.widget.RecyclerView;

import java.util.ArrayList;
import java.util.List;

public class FileAdapter
        extends RecyclerView.Adapter<FileAdapter.Holder> {

    public interface Listener {

        void onClick(FileItem item);

        void onLongClick(FileItem item);
    }

    private final Listener listener;

    private final List<FileItem> items =
            new ArrayList<>();

    public FileAdapter(Listener listener) {

        this.listener = listener;
    }

    public void submitList(List<FileItem> data) {

        items.clear();

        items.addAll(data);

        notifyDataSetChanged();
    }

    @NonNull
    @Override
    public Holder onCreateViewHolder(
            @NonNull ViewGroup parent,
            int viewType) {

        View view =
                LayoutInflater
                        .from(parent.getContext())
                        .inflate(
                                R.layout.item_file,
                                parent,
                                false
                        );

        return new Holder(view);
    }

    @Override
    public void onBindViewHolder(
            @NonNull Holder holder,
            int position) {

        FileItem item =
                items.get(position);

        holder.name.setText(item.name);

        if (item.directory) {

            holder.meta.setText(
                    "Folder • " +
                            FileUtils.displayDate(
                                    item.modified
                            )
            );

            holder.icon.setImageResource(
                    android.R.drawable
                            .ic_menu_agenda
            );

            holder.name.setTypeface(
                    null,
                    Typeface.BOLD
            );

        } else {

            holder.meta.setText(
                    FileUtils.displaySize(
                            item.size
                    ) +
                            " • " +
                            FileUtils.displayDate(
                                    item.modified
                            )
            );

            holder.icon.setImageResource(
                    android.R.drawable
                            .ic_menu_save
            );

            holder.name.setTypeface(
                    null,
                    Typeface.NORMAL
            );
        }

        holder.itemView.setOnClickListener(
                v -> listener.onClick(item)
        );

        holder.itemView.setOnLongClickListener(v -> {

            listener.onLongClick(item);

            return true;
        });
    }

    @Override
    public int getItemCount() {

        return items.size();
    }

    static class Holder
            extends RecyclerView.ViewHolder {

        final ImageView icon;
        final TextView name;
        final TextView meta;

        Holder(@NonNull View itemView) {

            super(itemView);

            icon =
                    itemView.findViewById(
                            R.id.file_icon
                    );

            name =
                    itemView.findViewById(
                            R.id.file_name
                    );

            meta =
                    itemView.findViewById(
                            R.id.file_meta
                    );
        }
    }
}


