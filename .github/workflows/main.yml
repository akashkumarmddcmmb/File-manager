package com.akash.filemanager;

import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.provider.DocumentsContract;
import android.view.Menu;
import android.view.MenuItem;
import android.view.View;
import android.widget.EditText;
import android.widget.PopupMenu;
import android.widget.TextView;

import androidx.activity.result.ActivityResultLauncher;
import androidx.activity.result.contract.ActivityResultContracts;
import androidx.annotation.NonNull;
import androidx.appcompat.app.AlertDialog;
import androidx.appcompat.app.AppCompatActivity;
import androidx.appcompat.widget.Toolbar;
import androidx.recyclerview.widget.LinearLayoutManager;
import androidx.recyclerview.widget.RecyclerView;

import com.google.android.material.snackbar.Snackbar;

import java.util.ArrayDeque;
import java.util.ArrayList;
import java.util.Comparator;
import java.util.Deque;
import java.util.List;
import java.util.Locale;

public class MainActivity
        extends AppCompatActivity
        implements FileAdapter.Listener {

    private static final String PREFS =
            "file_manager";

    private static final String KEY_TREE =
            "tree_uri";

    private RecyclerView recycler;

    private TextView pathText;

    private View emptyView;

    private FileAdapter adapter;

    private FileOperationManager operations;

    private Uri rootUri;

    private Uri currentUri;

    private final Deque<Uri> history =
            new ArrayDeque<>();

    private final List<FileItem> allItems =
            new ArrayList<>();

    private String searchText = "";

    private int sortMode = 0;

    private Uri pendingSource;

    private boolean pendingMove;

    private final ActivityResultLauncher<Intent>
            folderPicker =
            registerForActivityResult(
                    new ActivityResultContracts
                            .StartActivityForResult(),

                    result -> {

                        if (
                                result.getResultCode()
                                        == RESULT_OK
                                        &&
                                result.getData() != null
                        ) {

                            Uri tree =
                                    result.getData()
                                            .getData();

                            if (tree == null) {
                                return;
                            }

                            try {

                                getContentResolver()
                                        .takePersistableUriPermission(
                                                tree,
                                                Intent.FLAG_GRANT_READ_URI_PERMISSION
                                                        |
                                                Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                        );

                            } catch (SecurityException ignored) {
                            }

                            getSharedPreferences(
                                    PREFS,
                                    MODE_PRIVATE
                            )
                                    .edit()
                                    .putString(
                                            KEY_TREE,
                                            tree.toString()
                                    )
                                    .apply();

                            rootUri = tree;

                            currentUri = tree;

                            history.clear();

                            loadFiles();
                        }
                    }
            );

    private final ActivityResultLauncher<Intent>
            destinationPicker =
            registerForActivityResult(
                    new ActivityResultContracts
                            .StartActivityForResult(),

                    result -> {

                        if (
                                result.getResultCode()
                                        == RESULT_OK
                                        &&
                                result.getData() != null
                                        &&
                                result.getData()
                                                .getData() != null
                                        &&
                                pendingSource != null
                        ) {

                            Uri destination =
                                    result.getData()
                                            .getData();

                            try {

                                getContentResolver()
                                        .takePersistableUriPermission(
                                                destination,
                                                Intent.FLAG_GRANT_READ_URI_PERMISSION
                                                        |
                                                Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                        );

                            } catch (SecurityException ignored) {
                            }

                            if (pendingMove) {

                                operations.move(
                                        pendingSource,
                                        destination,
                                        callback()
                                );

                            } else {

                                operations.copy(
                                        pendingSource,
                                        destination,
                                        callback()
                                );
                            }

                            pendingSource = null;
                        }
                    }
            );

    @Override
    protected void onCreate(
            Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        setContentView(
                R.layout.activity_main
        );

        Toolbar toolbar =
                findViewById(
                        R.id.toolbar
                );

        setSupportActionBar(toolbar);

        toolbar.setTitle(
                R.string.app_name
        );

        recycler =
                findViewById(
                        R.id.recycler
                );

        pathText =
                findViewById(
                        R.id.path_text
                );

        emptyView =
                findViewById(
                        R.id.empty_view
                );

        adapter =
                new FileAdapter(this);

        recycler.setLayoutManager(
                new LinearLayoutManager(this)
        );

        recycler.setAdapter(adapter);

        operations =
                new FileOperationManager(this);

        String saved =
                getSharedPreferences(
                        PREFS,
                        MODE_PRIVATE
                )
                        .getString(
                                KEY_TREE,
                                null
                        );

        if (saved != null) {

            try {

                rootUri =
                        Uri.parse(saved);

                currentUri =
                        rootUri;

                loadFiles();

            } catch (Exception e) {

                chooseFolder();
            }

        } else {

            chooseFolder();
        }
    }

    private void chooseFolder() {

        Intent intent =
                new Intent(
                        Intent.ACTION_OPEN_DOCUMENT_TREE
                );

        intent.addFlags(
                Intent.FLAG_GRANT_READ_URI_PERMISSION
                        |
                Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                        |
                Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                        |
                Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
        );

        folderPicker.launch(intent);
    }

    private void loadFiles() {

        if (currentUri == null) {
            return;
        }

        new Thread(() -> {

            List<FileItem> result =
                    queryChildren(
                            currentUri
                    );

            runOnUiThread(() -> {

                allItems.clear();

                allItems.addAll(result);

                applyFilterAndSort();

                pathText.setText(
                        FileUtils.queryDisplayName(
                                this,
                                currentUri
                        )
                );
            });

        }).start();
    }

    private List<FileItem> queryChildren(
            Uri parent) {

        List<FileItem> result =
                new ArrayList<>();

        try {

            Uri childrenUri =
                    DocumentsContract
                            .buildChildDocumentsUriUsingTree(
                                    parent,
                                    DocumentsContract
                                            .getDocumentId(parent)
                            );

            String[] projection = {

                    DocumentsContract.Document
                            .COLUMN_DOCUMENT_ID,

                    DocumentsContract.Document
                            .COLUMN_DISPLAY_NAME,

                    DocumentsContract.Document
                            .COLUMN_MIME_TYPE,

                    DocumentsContract.Document
                            .COLUMN_SIZE,

                    DocumentsContract.Document
                            .COLUMN_LAST_MODIFIED
            };

            try (
                    android.database.Cursor cursor =
                            getContentResolver()
                                    .query(
                                            childrenUri,
                                            projection,
                                            null,
                                            null,
                                            null
                                    )
            ) {

                if (cursor == null) {
                    return result;
                }

                while (cursor.moveToNext()) {

                    String id =
                            cursor.getString(0);

                    String name =
                            cursor.getString(1);

                    String mime =
                            cursor.getString(2);

                    long size =
                            cursor.isNull(3)
                                    ? 0
                                    : cursor.getLong(3);

                    long modified =
                            cursor.isNull(4)
                                    ? 0
                                    : cursor.getLong(4);

                    boolean directory =
                            DocumentsContract.Document
                                    .MIME_TYPE_DIR
                                    .equals(mime);

                    Uri uri =
                            DocumentsContract
                                    .buildDocumentUriUsingTree(
                                            parent,
                                            id
                                    );

                    result.add(
                            new FileItem(
                                    uri,
                                    name == null
                                            ? "(unnamed)"
                                            : name,
                                    directory,
                                    size,
                                    modified,
                                    mime
                            )
                    );
                }
            }

        } catch (Exception e) {

            runOnUiThread(() ->
                    showMessage(
                            "Could not read this folder"
                    )
            );
        }

        return result;
    }

    private void applyFilterAndSort() {

        List<FileItem> shown =
                new ArrayList<>();

        String q =
                searchText
                        .trim()
                        .toLowerCase(
                                Locale.ROOT
                        );

        for (FileItem item : allItems) {

            if (
                    q.isEmpty()
                            ||
                    item.name
                            .toLowerCase(
                                    Locale.ROOT
                            )
                            .contains(q)
            ) {

                shown.add(item);
            }
        }

        Comparator<FileItem> comparator;

        switch (sortMode) {

            case 1:

                comparator =
                        Comparator.comparing(
                                a -> a.name
                                        .toLowerCase(
                                                Locale.ROOT
                                        )
                        );

                break;

            case 2:

                comparator =
                        (a, b) ->
                                b.name
                                        .compareToIgnoreCase(
                                                a.name
                                        );

                break;

            case 3:

                comparator =
                        Comparator.comparingLong(
                                a -> a.size
                        );

                break;

            case 4:

                comparator =
                        (a, b) ->
                                Long.compare(
                                        b.modified,
                                        a.modified
                                );

                break;

            default:

                comparator =
                        (a, b) -> {

                            if (
                                    a.directory
                                            !=
                                    b.directory
                            ) {

                                return a.directory
                                        ? -1
                                        : 1;
                            }

                            return a.name
                                    .compareToIgnoreCase(
                                            b.name
                                    );
                        };
        }

        shown.sort(comparator);

        adapter.submitList(shown);

        emptyView.setVisibility(
                shown.isEmpty()
                        ? View.VISIBLE
                        : View.GONE
        );
    }

    @Override
    public void onClick(FileItem item) {

        if (item.directory) {

            history.push(currentUri);

            currentUri =
                    item.uri;

            searchText = "";

            loadFiles();

        } else {

            openFile(item);
        }
    }

    @Override
    public void onLongClick(
            FileItem item) {

        PopupMenu menu =
                new PopupMenu(
                        this,
                        recycler
                );

        if (!item.directory) {

            menu.getMenu()
                    .add("Open");

            menu.getMenu()
                    .add("Share");
        }

        menu.getMenu()
                .add("Copy");

        menu.getMenu()
                .add("Move");

        menu.getMenu()
                .add("Rename");

        menu.getMenu()
                .add("Delete");

        menu.setOnMenuItemClickListener(
                menuItem -> {

                    String action =
                            menuItem
                                    .getTitle()
                                    .toString();

                    switch (action) {

                        case "Open":

                            openFile(item);

                            break;

                        case "Share":

                            shareFile(item);

                            break;

                        case "Copy":

                            chooseDestination(
                                    item.uri,
                                    false
                            );

                            break;

                        case "Move":

                            chooseDestination(
                                    item.uri,
                                    true
                            );

                            break;

                        case "Rename":

                            showRenameDialog(
                                    item
                            );

                            break;

                        case "Delete":

                            confirmDelete(
                                    item
                            );

                            break;
                    }

                    return true;
                }
        );

        menu.show();
    }

    private void openFile(
            FileItem item) {

        Intent intent =
                new Intent(
                        Intent.ACTION_VIEW
                );

        intent.setDataAndType(
                item.uri,
                item.mimeType == null
                        ? "*/*"
                        : item.mimeType
        );

        intent.addFlags(
                Intent.FLAG_GRANT_READ_URI_PERMISSION
        );

        try {

            startActivity(intent);

        } catch (Exception e) {

            showMessage(
                    "No application found to open this file."
            );
        }
    }

    private void shareFile(
            FileItem item) {

        Intent intent =
                new Intent(
                        Intent.ACTION_SEND
                );

        intent.setType(
                item.mimeType == null
                        ? "*/*"
                        : item.mimeType
        );

        intent.putExtra(
                Intent.EXTRA_STREAM,
                item.uri
        );

        intent.addFlags(
                Intent.FLAG_GRANT_READ_URI_PERMISSION
        );

        try {

            startActivity(
                    Intent.createChooser(
                            intent,
                            "Share file"
                    )
            );

        } catch (Exception e) {

            showMessage(
                    "No application available for sharing."
            );
        }
    }

    private void chooseDestination(
            Uri source,
            boolean move) {

        pendingSource = source;

        pendingMove = move;

        Intent intent =
                new Intent(
                        Intent.ACTION_OPEN_DOCUMENT_TREE
                );

        intent.addFlags(
                Intent.FLAG_GRANT_READ_URI_PERMISSION
                        |
                Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                        |
                Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
        );

        destinationPicker.launch(intent);
    }

    private FileOperationManager.Callback
    callback() {

        return new FileOperationManager.Callback() {

            @Override
            public void success(
                    String message) {

                showMessage(message);

                loadFiles();
            }

            @Override
            public void error(
                    String message) {

                showMessage(message);

                loadFiles();
            }
        };
    }

    private void showRenameDialog(
            FileItem item) {

        View view =
                getLayoutInflater()
                        .inflate(
                                R.layout.dialog_rename,
                                null
                        );

        EditText input =
                view.findViewById(
                        R.id.name_input
                );

        input.setText(item.name);

        input.setSelection(
                input.length()
        );

        new AlertDialog.Builder(this)

                .setTitle("Rename")

                .setView(view)

                .setNegativeButton(
                        "Cancel",
                        null
                )

                .setPositiveButton(
                        "Rename",
                        (dialog, which) -> {

                            String name =
                                    input.getText()
                                            .toString()
                                            .trim();

                            if (name.isEmpty()) {

                                showMessage(
                                        "Name cannot be empty"
                                );

                                return;
                            }

                            operations.rename(
                                    item.uri,
                                    name,
                                    callback()
                            );
                        }
                )

                .show();
    }

    private void confirmDelete(
            FileItem item) {

        new AlertDialog.Builder(this)

                .setTitle("Delete")

                .setMessage(
                        "Delete \"" +
                                item.name +
                                "\"? This cannot be undone."
                )

                .setNegativeButton(
                        "Cancel",
                        null
                )

                .setPositiveButton(
                        "Delete",
                        (dialog, which) ->
                                operations.delete(
                                        item.uri,
                                        callback()
                                )
                )

                .show();
    }

    private void showNewFolderDialog() {

        View view =
                getLayoutInflater()
                        .inflate(
                                R.layout.dialog_new_folder,
                                null
                        );

        EditText input =
                view.findViewById(
                        R.id.name_input
                );

        new AlertDialog.Builder(this)

                .setTitle("New folder")

                .setView(view)

                .setNegativeButton(
                        "Cancel",
                        null
                )

                .setPositiveButton(
                        "Create",
                        (dialog, which) -> {

                            String name =
                                    input.getText()
                                            .toString()
                                            .trim();

                            if (name.isEmpty()) {

                                showMessage(
                                        "Folder name cannot be empty"
                                );

                                return;
                            }

                            operations.createFolder(
                                    currentUri,
                                    name,
                                    callback()
                            );
                        }
                )

                .show();
    }

    private void showSearch() {

        final EditText input =
                new EditText(this);

        input.setHint(
                "Search current folder"
        );

        input.setSingleLine(true);

        input.setText(
                searchText
        );

        new AlertDialog.Builder(this)

                .setTitle("Search")

                .setView(input)

                .setNegativeButton(
                        "Clear",
                        (dialog, which) -> {

                            searchText = "";

                            applyFilterAndSort();
                        }
                )

                .setPositiveButton(
                        "Search",
                        (dialog, which) -> {

                            searchText =
                                    input.getText()
                                            .toString();

                            applyFilterAndSort();
                        }
                )

                .show();
    }

    private void showSortMenu(
            View anchor) {

        PopupMenu menu =
                new PopupMenu(
                        this,
                        anchor
                );

        menu.getMenu()
                .add("Folders first");

        menu.getMenu()
                .add("Name A-Z");

        menu.getMenu()
                .add("Name Z-A");

        menu.getMenu()
                .add("Size");

        menu.getMenu()
                .add("Modified date");

        menu.setOnMenuItemClickListener(
                item -> {

                    String title =
                            item.getTitle()
                                    .toString();

                    if (title.equals(
                            "Name A-Z"
                    )) {

                        sortMode = 1;

                    } else if (title.equals(
                            "Name Z-A"
                    )) {

                        sortMode = 2;

                    } else if (title.equals(
                            "Size"
                    )) {

                        sortMode = 3;

                    } else if (title.equals(
                            "Modified date"
                    )) {

                        sortMode = 4;

                    } else {

                        sortMode = 0;
                    }

                    applyFilterAndSort();

                    return true;
                }
        );

        menu.show();
    }

    private void showMessage(
            String message) {

        Snackbar.make(
                recycler,
                message,
                Snackbar.LENGTH_LONG
        ).show();
    }

    @Override
    public boolean onCreateOptionsMenu(
            Menu menu) {

        getMenuInflater().inflate(
                R.menu.main_menu,
                menu
        );

        return true;
    }

    @Override
    public boolean onOptionsItemSelected(
            @NonNull MenuItem item) {

        int id =
                item.getItemId();

        if (id == R.id.action_back) {

            if (!history.isEmpty()) {

                currentUri =
                        history.pop();

                searchText = "";

                loadFiles();

            } else {

                showMessage(
                        "Already at selected root folder"
                );
            }

            return true;
        }

        if (id == R.id.action_refresh) {

            loadFiles();

            return true;
        }

        if (id == R.id.action_search) {

            showSearch();

            return true;
        }

        if (id == R.id.action_new_folder) {

            showNewFolderDialog();

            return true;
        }

        if (id == R.id.action_sort) {

            showSortMenu(
                    findViewById(
                            R.id.toolbar
                    )
            );

            return true;
        }

        if (id == R.id.action_choose_folder) {

            chooseFolder();

            return true;
        }

        return super.onOptionsItemSelected(
                item
        );
    }

    @Override
    protected void onDestroy() {

        if (operations != null) {

            operations.shutdown();
        }

        super.onDestroy();
    }
}


