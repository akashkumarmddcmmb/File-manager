name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"


      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      - name: Check versions
        run: |
          node --version
          bun --version
          java -version


      - name: Install dependencies
        run: |
          bun install --frozen-lockfile


      - name: Build web application
        run: |
          bun run build


      - name: Capacitor Sync
        run: |
          bunx cap sync android


      - name: Verify Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/capacitor.build.gradle
          test -f capacitor.settings.gradle

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Android project verified successfully."


      - name: Check Gradle
        working-directory: android
        run: |
          ./gradlew --version


      - name: Check Gradle modules
        working-directory: android
        run: |
          ./gradlew projects \
            --no-daemon \
            --stacktrace


      - name: Clean
        working-directory: android
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace


      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
