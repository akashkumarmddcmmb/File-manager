name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. JDK 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Install Gradle
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'


      # --------------------------------------------------
      # 4. Find Android/Gradle project
      # --------------------------------------------------
      - name: Find Gradle project
        shell: bash
        run: |

          echo "======================================"
          echo "Searching for Gradle project..."
          echo "======================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Searching settings.gradle files..."

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo ""
            echo "All Gradle related files:"
            find . -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \
              -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo ""
          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"


      # --------------------------------------------------
      # 5. Check Gradle project
      # --------------------------------------------------
      - name: Check Gradle project
        shell: bash
        run: |

          echo "======================================"
          echo "Gradle Project"
          echo "======================================"

          cd "$PROJECT_DIR"

          echo "Working directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Modules:"
          find . -maxdepth 2 -type d -print


      # --------------------------------------------------
      # 6. Create Gradle Wrapper if missing
      # --------------------------------------------------
      - name: Create Gradle Wrapper
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Checking Gradle Wrapper"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            echo "gradlew already exists."

          else

            echo "gradlew is missing."
            echo "Creating Gradle Wrapper..."

            gradle wrapper --gradle-version 8.11

          fi


      # --------------------------------------------------
      # 7. Make wrapper executable
      # --------------------------------------------------
      - name: Make Gradle Wrapper executable
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Gradle Wrapper:"
          ls -l ./gradlew


      # --------------------------------------------------
      # 8. Show Gradle version
      # --------------------------------------------------
      - name: Check Gradle version
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          ./gradlew --version


      # --------------------------------------------------
      # 9. Clean
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------
      # 10. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Debug APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Searching for APK..."
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
