- name: Build Debug APK
  working-directory: android
  shell: bash
  run: |
    set +e

    ./gradlew assembleDebug \
      --stacktrace \
      --info \
      --warning-mode all \
      2>&1 | tee ../gradle-build.log

    GRADLE_EXIT=${PIPESTATUS[0]}

    echo "Gradle exit code: $GRADLE_EXIT"

    echo "========== COMPILER ERRORS =========="
    grep -n -E "error:|ERROR|FAILED|cannot find symbol|does not exist|Compilation failed|Execution failed" ../gradle-build.log || true

    exit $GRADLE_EXIT

- name: Upload Gradle Error Log
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: gradle-build-error-log
    path: gradle-build.log
    if-no-files-found: warn
    retention-days: 7
