name: Build Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Check environment
        shell: bash
        run: |
          set -e
          echo "Node:"
          node --version

          echo "Bun:"
          bun --version

          echo "Java:"
          java -version

      # IMPORTANT:
      # Do NOT freeze the lockfile because the edited
      # project package.json and bun.lock are currently
      # out of sync.
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          bun install --no-frozen-lockfile

      - name: Build web application
        shell: bash
        run: |
          set -e
          bun run build

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e
          bunx cap sync android

      - name: Verify Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          test -f capacitor.settings.gradle
          test -f app/capacitor.build.gradle

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Android project verification successful."

      - name: Check Gradle
        working-directory: android
        shell: bash
        run: |
          set -e
          ./gradlew --version

      - name: Check Gradle modules
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      - name: Clean Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building Debug APK..."
          echo "======================================"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
