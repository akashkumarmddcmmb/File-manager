name: Build Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout project
      # ----------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Node.js 22
      # ----------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ----------------------------------------
      # 3. Bun
      # Project contains bun.lock
      # ----------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"


      # ----------------------------------------
      # 4. Java 21
      # Project uses modern Android/Capacitor
      # ----------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"


      # ----------------------------------------
      # 5. Check versions
      # ----------------------------------------
      - name: Check environment
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "Bun:"
          bun --version

          echo "Java:"
          java -version


      # ----------------------------------------
      # 6. Install exact locked dependencies
      # ----------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          bun install --frozen-lockfile


      # ----------------------------------------
      # 7. Build web application
      # ----------------------------------------
      - name: Build web application
        shell: bash
        run: |
          set -e

          bun run build


      # ----------------------------------------
      # 8. Capacitor Android sync
      # ----------------------------------------
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          bunx cap sync android


      # ----------------------------------------
      # 9. Verify Android project
      # ----------------------------------------
      - name: Verify Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          test -f capacitor.settings.gradle
          test -f app/capacitor.build.gradle

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Android project verification successful."


      # ----------------------------------------
      # 10. Check Gradle version
      # ----------------------------------------
      - name: Check Gradle
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew --version


      # ----------------------------------------
      # 11. Check all Gradle modules
      # ----------------------------------------
      - name: Check Gradle modules
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew projects \
            --no-daemon \
            --stacktrace


      # ----------------------------------------
      # 12. Clean
      # ----------------------------------------
      - name: Clean Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ----------------------------------------
      # 13. Build Debug APK
      # ----------------------------------------
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building Debug APK..."
          echo "======================================"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ----------------------------------------
      # 14. Verify APK
      # ----------------------------------------
      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for generated APK..."
          echo "======================================"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."


      # ----------------------------------------
      # 15. Upload APK
      # ----------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
